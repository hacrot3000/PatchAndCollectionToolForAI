name: One-time merge main into remote integration candidate
on:
  push:
    branches:
      - integration/merge-main-into-remote-20261105
    paths:
      - .github/workflows/taskdeck_merge_main_integration_20261105.yml
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge exact main snapshot with Git three-way -X ours
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TaskDeck merge integration'
          git config user.email 'taskdeck-merge@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "2ded4207222acaed4f07f50fc9fd3bdfea5234d5"
          git -c core.hooksPath=/dev/null merge --no-commit --no-ff -X ours 2ded4207222acaed4f07f50fc9fd3bdfea5234d5
          test -z "$(git diff --name-only --diff-filter=U)"
          git rm -f -- .github/workflows/taskdeck_merge_main_integration_20261105.yml
          git add -A
          git write-tree
      - name: Emit exact merged conflicting source chunks for authenticated Git blob upload
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          files=[".github/workflows/taskdeck_remote_agent.yml","README.md","docs/TASKDECK_REMOTE_IMPLEMENTATION_STATUS.md","docs/TASKDECK_REMOTE_INSTALLATION.md","vscode_tasks_menu_go/cmd/taskdeck_remote_login/README.md","vscode_tasks_menu_go/cmd/taskdeck_remote_login/main.go","vscode_tasks_menu_go/internal/remoteportal/relay.go","vscode_tasks_menu_go/internal/remoterelay/app_mailbox.go","vscode_tasks_menu_go/internal/remoterelay/http.go","vscode_tasks_menu_go/internal/remotetransport/action.go","vscode_tasks_menu_go/internal/remotetransport/action_test.go","vscode_tasks_menu_go/internal/remotetransport/ping_client.go","vscode_tasks_menu_go/internal/server/remote_access_dispatch.go","vscode_tasks_menu_go/internal/server/remote_access_ping_host.go","vscode_tasks_menu_go/internal/server/remote_access_session.go","vscode_tasks_menu_go/internal/server/remote_app_ping_wss_integration_test.go"]
          for path in files:
              raw=Path(path).read_bytes()
              expected=subprocess.check_output(["git","hash-object","--no-filters",path]).decode().strip()
              text=raw.decode("utf-8")
              print("MERGE_BEGIN|"+path+"|"+expected+"|"+str(len(raw)))
              for i in range(0,len(text),1500):
                  print("MERGE_CHUNK|"+json.dumps(text[i:i+1500],ensure_ascii=True))
              print("MERGE_END|"+path)
          PY
