name: Apply v6.20.2 hardening groups

on:
  push:
    branches:
      - ptv-v6.20.2-upload-helper
    paths:
      - .github/workflows/apply-v6202-groups.yml

permissions:
  contents: write

jobs:
  apply-groups:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: ptv-v6.20.2-hardening-work
          fetch-depth: 0

      - name: Prepare patch decoder
        shell: bash
        run: |
          set -euo pipefail
          expected=21dc9164d6d72254c5b817c4ae6fe7051f9e8bea
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || { echo "Unexpected work branch HEAD: $actual"; exit 2; }
          git fetch origin ptv-v6.20.2-upload-helper
          git config user.name "Patch Tool CI"
          git config user.email "patch-tool-ci@users.noreply.github.com"
          cat > /tmp/decode-group <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          name="$1"
          helper="origin/ptv-v6.20.2-upload-helper"
          : > "/tmp/${name}.b64"
          while IFS= read -r part; do
            git show "${helper}:${part}" >> "/tmp/${name}.b64"
          done < <(git ls-tree -r --name-only "$helper" | grep -E "^\\.ptv_upload/${name}\\.part[0-9]+$" | sort)
          test -s "/tmp/${name}.b64"
          base64 -d "/tmp/${name}.b64" | gzip -d > "/tmp/${name}.patch"
          git apply --check "/tmp/${name}.patch"
          git apply "/tmp/${name}.patch"
          EOF
          chmod +x /tmp/decode-group

      - name: Commit Git Safe and COLLECT hardening
        shell: bash
        run: |
          set -euo pipefail
          /tmp/decode-group 02_git_collect
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_git_safe_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_collect_historical_actions_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_ai_collect_contract_v6_20_0.py
          git add -A
          git commit -m "harden: bound Git operations and propagate COLLECT failures"
          git push origin HEAD:ptv-v6.20.2-hardening-work

      - name: Commit Manual Execution hardening
        shell: bash
        run: |
          set -euo pipefail
          /tmp/decode-group 03_manual
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_manual_execution_v6_20_0.py
          git add -A
          git commit -m "harden: validate manual execution evidence and argv"
          git push origin HEAD:ptv-v6.20.2-hardening-work

      - name: Commit runner and queue refactor
        shell: bash
        run: |
          set -euo pipefail
          /tmp/decode-group 05_refactor
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_patch_recovery_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_failed_queue_persistence_v6_20_0.py
          git add -A
          git commit -m "refactor: consolidate rollback and queue report bookkeeping"
          git push origin HEAD:ptv-v6.20.2-hardening-work

      - name: Commit Tool Health and v6.20.2 release sync
        shell: bash
        run: |
          set -euo pipefail
          /tmp/decode-group 04_health
          /tmp/decode-group 06_release_sync
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_tool_health_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_package_checksums_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_version_consistency_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_integrity_v6_20_0.py
          git add -A
          git commit -m "release: synchronize v6.20.2 health metadata docs and regression gates"
          git push origin HEAD:ptv-v6.20.2-hardening-work
