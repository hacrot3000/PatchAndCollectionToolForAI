name: TaskDeck Bounded Remote PTY Framing
on:
  pull_request:
    paths:
      - 'vscode_tasks_menu_go/internal/remotetransport/pty_frame*'
      - 'vscode_tasks_menu_go/internal/remotetransport/pty_sequence*'
      - '.github/workflows/taskdeck_remote_pty_framing.yml'
permissions:
  contents: read
jobs:
  bounded-pty-framing:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: vscode_tasks_menu_go/go.mod
      - name: Verify authenticated PTY framing, strict limits, no untrusted remote action
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/remotetransport -run '^TestRemotePTY(Frame|Sequence)' -count=1
