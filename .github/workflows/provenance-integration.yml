name: Apply provenance integration
on:
  push:
    branches: [ptv-provenance-signature-trust]
    paths: [.github/workflows/provenance-integration.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ptv-provenance-signature-trust
          fetch-depth: 0
      - name: Apply integration, test, commit
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/provenance-core.patch <<'PATCH'
diff --git a/_patch_lib/docs/PATCH_PACKAGE_SCHEMA.json b/_patch_lib/docs/PATCH_PACKAGE_SCHEMA.json
index 3ffa27e..e0fae88 100644
--- a/_patch_lib/docs/PATCH_PACKAGE_SCHEMA.json
+++ b/_patch_lib/docs/PATCH_PACKAGE_SCHEMA.json
@@ -13,6 +13,7 @@
       "project",
       "patch",
       "compatibility",
+      "provenance",
       "ai_context",
       "execution",
       "batch",
@@ -544,6 +545,38 @@
             }
           }
         }
+      },
+      "provenance": {
+        "type": "object",
+        "required": [
+          "format",
+          "algorithm",
+          "key_id",
+          "signature"
+        ],
+        "allowed_fields": [
+          "format",
+          "algorithm",
+          "key_id",
+          "signature"
+        ],
+        "fields": {
+          "format": {
+            "type": "string",
+            "const": "ptv-patch-signature-v1"
+          },
+          "algorithm": {
+            "type": "string",
+            "const": "ed25519"
+          },
+          "key_id": {
+            "type": "string"
+          },
+          "signature": {
+            "type": "string"
+          }
+        },
+        "description": "Optional Ed25519 provenance signature. Trust is resolved only from local .python_patch_tool.json policy."
       }
     }
   },
@@ -552,7 +585,7 @@
     "ops": "PATCH_TOOL_OPS.json and no Python entrypoint.",
     "ambiguous": "A package containing both OPS and a Python entrypoint, or multiple Python entrypoints, is rejected before project modification."
   },
-  "preflight_guarantee": "Schema, compatibility, payload, declared resources, declared file hashes/anchors, data-only OPS sequential dry-run, post-command cwd/executable, and Git executable requirements are checked before patch payload execution.",
+  "preflight_guarantee": "Schema, compatibility, optional/required Ed25519 provenance trust, payload, declared resources, declared file hashes/anchors, data-only OPS sequential dry-run, post-command cwd/executable, and Git executable requirements are checked before patch payload execution.",
   "rollback_contract": "Optional recovery.rollback is fail-closed and metadata-driven. rollback.targets must exactly cover the PATCH target set and every rollback target must have an explicit preflight.files baseline (exists=false for initially missing paths, or exists=true plus sha256 for existing files). The runner snapshots only those declared regular-file targets before payload execution. Automatic rollback may run only for configured payload_failure/post_patch_failure stages, before Git policy. For exists=false targets, the parent directory must already exist as a real non-symlink directory inside the project before payload execution; rollback does not invent/remove parent directories. Rollback snapshot creation revalidates the declared baseline to close preflight-to-snapshot TOCTOU.",
   "batch_execution_contract": "Selected PATCH manifests may declare batch.depends_on by existing manifest.patch.id. Dependency/related-target failures are always BLOCKED; legacy on_dependency_failure=run_anyway remains schema-readable only for compatibility and is ignored at runtime. Cross-run unresolved predecessor enforcement is relation-based per selected successor; multiple related unresolved predecessors require Smart Resume before a singular batch.previous_failure successor batch can proceed.",
   "batch_transaction_contract": "Batch transaction policy is target-bounded atomic rollback. Every selected PATCH must declare targets; validation.profiles, post_patch.commands, on_failure.commands and Git add/commit/push are rejected in batch-atomic mode."
diff --git a/_patch_lib/python_patch_package_schema.py b/_patch_lib/python_patch_package_schema.py
index f6cb25d..0f4a177 100644
--- a/_patch_lib/python_patch_package_schema.py
+++ b/_patch_lib/python_patch_package_schema.py
@@ -600,6 +600,18 @@ def run_preflight(
     }
     checks: list[dict[str, Any]] = report["checks"]
 
+    # Cryptographic provenance is a local trust-policy preflight contract.
+    # Verification covers canonical manifest semantics plus every regular
+    # package file and always completes before any payload/source mutation.
+    try:
+        from python_patch_provenance import ProvenanceError, verify_patch_provenance
+        checks.append(verify_patch_provenance(root, manifest, extracted))
+    except ProvenanceError as exc:
+        report["status"] = "FAIL"
+        issue = {"kind": exc.kind, "field": "manifest.provenance", "message": str(exc)}
+        report["issues"] = [issue]
+        raise PatchSchemaError(str(exc), kind=exc.kind, issues=[issue], report=report) from exc
+
     # Project identity and named validation profiles are local-policy contracts.
     # PATCH packages may request them, but may not define the executable command.
     try:
diff --git a/_patch_lib/python_patch_runner.py b/_patch_lib/python_patch_runner.py
index f27ec92..0862961 100644
--- a/_patch_lib/python_patch_runner.py
+++ b/_patch_lib/python_patch_runner.py
@@ -1489,6 +1489,11 @@ def _prepare_package(root: Path, source: Path, *, skip_validation: bool = False)
     manifest: dict = {}
     extracted: Path | None = None
     if source.suffix.lower() == ".py":
+        try:
+            from python_patch_provenance import ProvenanceError, enforce_legacy_unsigned_policy
+            enforce_legacy_unsigned_policy(root, package_label=source.name)
+        except ProvenanceError as exc:
+            raise PatchSchemaError(str(exc), kind=exc.kind) from exc
         kind = "python"
         payload = source
         preflight = {
@@ -1513,6 +1518,11 @@ def _prepare_package(root: Path, source: Path, *, skip_validation: bool = False)
     manifest_path = extracted / "PATCH_TOOL_MANIFEST.json"
     manifest, kind, payload, legacy_scripts = _find_payload(extracted, archive_name=source.name)
     if not manifest_path.is_file():
+        try:
+            from python_patch_provenance import ProvenanceError, enforce_legacy_unsigned_policy
+            enforce_legacy_unsigned_policy(root, package_label=source.name)
+        except ProvenanceError as exc:
+            raise PatchSchemaError(str(exc), kind=exc.kind) from exc
         if kind != "python":
             raise PatchSchemaError(
                 "legacy archive without PATCH_TOOL_MANIFEST.json must contain a positively recognized Python patch entrypoint",
PATCH
          git apply --check /tmp/provenance-core.patch
          git apply /tmp/provenance-core.patch
          python3 _patch_lib/python_patch_release_metadata.py --tool-dir .
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_provenance_signature_v6_21_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_patch_preflight_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_public_entry_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_historical_compatibility_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_package_checksums_v6_20_0.py
          rm -f .github/workflows/provenance-integration.yml .ptv_work/PROGRESS.md
          git config user.name 'Patch Tool CI'
          git config user.email 'patch-tool-ci@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate local Ed25519 PATCH provenance trust'
          git push origin HEAD:ptv-provenance-signature-trust
