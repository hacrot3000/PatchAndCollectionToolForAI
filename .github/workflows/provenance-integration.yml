name: Apply provenance integration
on:
  push:
    branches: [ptv-provenance-signature-trust]
    paths: [.github/workflows/provenance-integration.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ptv-provenance-signature-trust
          fetch-depth: 0
      - name: Apply integration, test, commit
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/provenance-core.patch
          git apply --check /tmp/provenance-core.patch
          git apply /tmp/provenance-core.patch
          python3 _patch_lib/python_patch_release_metadata.py --tool-dir .
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_provenance_signature_v6_21_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_patch_preflight_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_public_entry_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_historical_compatibility_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_package_checksums_v6_20_0.py
          rm -f .github/workflows/provenance-integration.yml .ptv_work/PROGRESS.md
          git config user.name 'Patch Tool CI'
          git config user.email 'patch-tool-ci@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate local Ed25519 PATCH provenance trust'
          git push origin HEAD:ptv-provenance-signature-trust
