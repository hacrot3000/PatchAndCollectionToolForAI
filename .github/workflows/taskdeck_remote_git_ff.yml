name: TaskDeck Remote Git FF (bounded, offline)
on:
  pull_request:
    paths:
      - 'vscode_tasks_menu_go/internal/server/remote_git_pull*'
      - 'vscode_tasks_menu_go/internal/server/remote_access_dispatch.go'
      - 'vscode_tasks_menu_go/internal/remotetransport/**'
      - 'vscode_tasks_menu_go/cmd/taskdeck_remote_login/**'
      - '.github/workflows/taskdeck_remote_git_ff.yml'
permissions:
  contents: read
jobs:
  real-git-ff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: vscode_tasks_menu_go/go.mod
      - name: Verify E2EE Git Pull file result is pinned to its own type
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/remotetransport -run '^TestRemoteGitPullFileApply' -count=1
      - name: Exercise real FF, symlinks, index and lock guards with OS Git
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run '^TestRemoteGitPullFiles' -count=1 -timeout=4m
      - name: Confirm Native GUI review and one-use non-replayable apply
        working-directory: vscode_tasks_menu_go
        run: go test -race ./cmd/taskdeck_remote_login -run '^TestNativeGUIPullFiles' -count=1
