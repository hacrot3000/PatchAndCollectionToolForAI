name: TaskDeck Docker and Windows launchers

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.taskdeck"
      - ".dockerignore"
      - "deploy/**"
      - "vscode_tasks_menu_go/**"
      - "python_patch_entry.py"
      - "run_python_patches.sh"
      - "run_windows_native_tests.ps1"
      - "_patch_lib/**"
      - ".github/workflows/taskdeck_windows_docker.yml"
  pull_request:
    paths:
      - "Dockerfile.taskdeck"
      - ".dockerignore"
      - "deploy/**"
      - "vscode_tasks_menu_go/**"
      - ".github/workflows/taskdeck_windows_docker.yml"
      - "run_windows_native_tests.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-runtime:
    name: Core image · Linux PTY smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash scripts
        run: bash -n deploy/docker/entrypoint.sh deploy/docker/smoke.sh
      - name: Build core image (no Go toolchain in final layer)
        run: docker build --file Dockerfile.taskdeck --target runtime --tag taskdeck:ci .
      - name: Check tools and boot HTTPS server on mounted project with spaces
        run: bash deploy/docker/smoke.sh taskdeck:ci
      - name: Show image size
        run: |
          docker image inspect taskdeck:ci --format 'Image size bytes: {{.Size}}'
      - name: Build optional dev profile
        run: docker build --file Dockerfile.taskdeck --target dev --tag taskdeck:dev-ci .
      - name: Smoke dev compiler and Node.js
        run: docker run --rm --entrypoint bash taskdeck:dev-ci -ec 'command -v gcc && command -v g++ && node --version && npm --version'

  windows-launcher:
    name: Windows launcher syntax and packaging
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell scripts on Windows
        shell: pwsh
        run: |
          foreach ($file in @('deploy/windows/taskdeck.ps1', 'deploy/windows/taskdeck-wsl.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Get-Location) $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "$file has PowerShell parse errors"
            }
            Write-Host "PASS: $file"
          }
          if (-not (Test-Path deploy/windows/taskdeck.cmd)) { throw 'CMD entrypoint missing' }
      - name: Verify launcher safety contracts
        shell: pwsh
        run: |
          $code = Get-Content deploy/windows/taskdeck.ps1 -Raw
          foreach ($token in @('no-new-privileges', '127.0.0.1:', 'type=bind,source=', 'TASKDECK_AUTO_CONFIG=1', 'TASKDECK_INIT_WORKSPACE=1', 'Get-ProjectHash', 'Docker-Exists')) {
            if (-not $code.Contains($token)) { throw "Missing launcher safety contract: $token" }
          }
          Write-Host 'PASS: explicit project mount, loopback bind and per-project named volumes'

      - name: Set up .NET for optional native Windows GUI shell
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows GUI launcher x64
        shell: pwsh
        run: |
          dotnet publish deploy/windows/launcher/TaskDeckLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o deploy/windows/dist/app
          if ($LASTEXITCODE -ne 0) { throw 'Windows launcher publish failed' }
          Copy-Item deploy/windows/taskdeck.ps1 deploy/windows/dist/app/
          Copy-Item deploy/windows/taskdeck.cmd deploy/windows/dist/app/
          Copy-Item deploy/windows/taskdeck-wsl.ps1 deploy/windows/dist/app/
          # Include the minimal Docker build context, so a downloaded ZIP works
          # without cloning GitHub or installing a Go compiler on Windows.
          Copy-Item Dockerfile.taskdeck deploy/windows/dist/app/
          Copy-Item .dockerignore deploy/windows/dist/app/
          Copy-Item python_patch_entry.py deploy/windows/dist/app/
          Copy-Item run_python_patches.sh deploy/windows/dist/app/
          Copy-Item vscode_tasks_menu_go deploy/windows/dist/app/vscode_tasks_menu_go -Recurse
          Copy-Item _patch_lib deploy/windows/dist/app/_patch_lib -Recurse
          New-Item -ItemType Directory -Force deploy/windows/dist/app/deploy/docker | Out-Null
          Copy-Item deploy/docker/entrypoint.sh deploy/windows/dist/app/deploy/docker/
          Compress-Archive -Path deploy/windows/dist/app/* -DestinationPath deploy/windows/dist/TaskDeckLauncher-win-x64.zip -Force
      - name: Attach Windows GUI launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskDeckLauncher-win-x64
          path: deploy/windows/dist/TaskDeckLauncher-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  native-windows-audit:
    name: Windows native Go gaps + Python Patch lane (not a release gate)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - name: Probe native Go compilation without disguising ConPTY limitations
        shell: pwsh
        run: |
          Push-Location vscode_tasks_menu_go
          $env:GOPROXY = 'off'
          $env:GOSUMDB = 'off'
          & cmd.exe /d /c 'go build -buildvcs=false -trimpath -o taskdeck-native-probe.exe ./cmd/vscode_tasks_menu > native-build.txt 2>&1'
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) {
            Write-Host 'Native Windows Go backend is BLOCKED (expected until ConPTY/IPC port).'
            Get-Content vscode_tasks_menu_go/native-build.txt | Select-Object -First 50
            Add-Content $env:GITHUB_STEP_SUMMARY 'Windows native Go backend: BLOCKED. Docker/WSL2 backend remains supported; see docs/WINDOWS_NATIVE_PORT.md.'
          } else {
            Write-Host 'Native Go compiles, but ConPTY runtime/security tests are still REQUIRED.'
            Add-Content $env:GITHUB_STEP_SUMMARY 'Windows native Go compile: PASS; ConPTY runtime verification still pending.'
          }
          # GitHub Actions pwsh propagates the last native process's exit
          # code even after a successful audit summary. Explicitly reset it.
          $global:LASTEXITCODE = 0
          exit 0
      - name: Existing Python Patch Tool Windows runtime lane
        shell: pwsh
        run: |
          .\run_windows_native_tests.ps1
