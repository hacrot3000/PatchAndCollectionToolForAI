name: Fix manual shell option clusters

on:
  push:
    branches:
      - ptv-v6.20.2-upload-helper
    paths:
      - .github/workflows/fix-manual-shell-clusters.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ptv-v6.20.2-hardening-work
          fetch-depth: 0
      - name: Reject shell option clusters containing c
        shell: bash
        run: |
          set -euo pipefail
          expected=c9d12ee6a4413ee8f74258c41aa7a3570f82825a
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || { echo "Unexpected work branch HEAD: $actual"; exit 2; }

          python3 - <<'PY'
          from pathlib import Path
          p=Path('_patch_lib/python_patch_manual_workflow.py')
          text=p.read_text(encoding='utf-8')
          old='''        if kind in {"shell", "python"}:\n            if token == "-c" or token.startswith("-c"):\n                return True\n'''
          new='''        if kind == "shell":\n            # POSIX shells accept short options as clusters: -lc, -xc,\n            # -ec, etc.  Any short-option cluster containing c enables an\n            # inline command string and must be rejected fail-closed.\n            if token.startswith("-") and not token.startswith("--") and "c" in token[1:]:\n                return True\n        elif kind == "python":\n            if token == "-c" or token.startswith("-c"):\n                return True\n'''
          assert old in text, 'manual shell validator anchor not found'
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          t=Path('_patch_lib/self_test_manual_execution_v6_20_0.py')
          text=t.read_text(encoding='utf-8')
          anchor="    {'steps':[{'id':'x','argv':['bash','-cprintf x']}]},\n"
          insert=(anchor+
                  "    {'steps':[{'id':'x','argv':['bash','-lc','echo x']}]},\n"+
                  "    {'steps':[{'id':'x','argv':['sh','-xc','echo x']}]},\n"+
                  "    {'steps':[{'id':'x','argv':['/bin/bash','-ec','echo x']}]},\n")
          assert anchor in text, 'manual test anchor not found'
          t.write_text(text.replace(anchor,insert,1),encoding='utf-8')
          PY

          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/self_test_manual_execution_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import sys
          sys.path.insert(0,'_patch_lib')
          from python_patch_manual_workflow import validate_manual_execution, ManualWorkflowError
          for argv in [['bash','-lc','echo x'],['sh','-xc','echo x'],['/bin/bash','-ec','echo x']]:
              try:
                  validate_manual_execution({'steps':[{'id':'x','argv':argv}]})
              except ManualWorkflowError:
                  continue
              raise SystemExit(f'FAIL accepted {argv!r}')
          print('PASS: shell option-cluster inline evaluators rejected')
          PY

          git config user.name "Patch Tool CI"
          git config user.email "patch-tool-ci@users.noreply.github.com"
          git add _patch_lib/python_patch_manual_workflow.py _patch_lib/self_test_manual_execution_v6_20_0.py
          git commit -m "fix: reject clustered shell inline-eval options"
          git push origin HEAD:ptv-v6.20.2-hardening-work
