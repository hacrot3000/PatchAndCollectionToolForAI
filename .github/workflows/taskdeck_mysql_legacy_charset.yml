name: TaskDeck MySQL Legacy Charset

on:
  pull_request:
    paths:
      - 'vscode_tasks_menu_go/internal/dbmysql/**'
      - 'vscode_tasks_menu_go/internal/dbadapter/**'
      - '.github/workflows/taskdeck_mysql_legacy_charset.yml'
  push:
    branches: [main]
    paths:
      - 'vscode_tasks_menu_go/internal/dbmysql/**'
      - 'vscode_tasks_menu_go/internal/dbadapter/**'
      - '.github/workflows/taskdeck_mysql_legacy_charset.yml'

permissions:
  contents: read

jobs:
  legacy-mysql:
    name: Legacy MySQL charset (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go-version: '1.23.x'
          - os: macos-15
            go-version: '1.25.x'
    defaults:
      run:
        working-directory: vscode_tasks_menu_go
    env:
      GOPROXY: off
      GOSUMDB: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Validate Go syntax
        run: |
          gofmt -e internal/dbmysql/handler.go >/dev/null
          gofmt -e internal/dbmysql/execute_edit.go >/dev/null
          gofmt -e internal/dbmysql/config.go >/dev/null
          gofmt -e internal/dbmysql/config_test.go >/dev/null
          gofmt -e internal/dbmysql/legacy_charset_test.go >/dev/null
      - name: Verify all MySQL adapter behavior, including legacy client
        run: go test -count=1 -timeout=5m ./internal/dbmysql ./internal/dbadapter ./internal/dbprofile
      - name: Compile TaskDeck daemon
        run: go build -buildvcs=false -o "$RUNNER_TEMP/taskdeck" ./cmd/vscode_tasks_menu
