name: TaskDeck Remote Agent (Go)
on:
  push:
    branches: [main]
    paths:
      - 'vscode_tasks_menu_go/internal/remoteclientkey/**'
      - 'vscode_tasks_menu_go/internal/remoteportal/**'
      - 'vscode_tasks_menu_go/internal/remoterelay/**'
      - 'vscode_tasks_menu_go/internal/remotetransport/**'
      - 'vscode_tasks_menu_go/internal/remotelimits/**'
      - 'vscode_tasks_menu_go/cmd/taskdeck_crypto_fixture/**'
      - 'remote_portal/public/remote_crypto.js'
      - 'remote_portal/tests/browser_crypto.test.cjs'
      - 'remote_portal/tests/browser_echo_crypto.test.cjs'
      - 'remote_portal/tests/browser_login_crypto.test.cjs'
      - 'remote_portal/tests/fixtures/remote_login_crypto.js'
      - 'remote_portal/tests/credential_boundary.test.cjs'
      - 'remote_portal/tests/native_gui_assets.test.cjs'
      - 'remote_portal/tests/native_gui_interactions.test.cjs'
      - 'remote_portal/tests/native_gui_bulk_task_pages.test.cjs'
      - 'remote_portal/tests/native_gui_task_*.test.cjs'
      - 'remote_portal/tests/native_gui_two_picks.test.cjs'
      - 'remote_portal/tests/native_gui_long_task*.test.cjs'
      - 'remote_portal/tests/native_gui_git_commit.test.cjs'
      - 'remote_portal/tests/native_gui_git_push.test.cjs'
      - 'remote_portal/tests/native_gui_git_fetch.test.cjs'
      - 'remote_portal/tests/native_gui_git_index.test.cjs'
      - 'remote_portal/tests/native_gui_git_file.test.cjs'
      - 'remote_portal/tests/native_gui_git_branches.test.cjs'
      - 'remote_portal/tests/native_gui_git_remotes.test.cjs'
      - 'remote_portal/tests/native_gui_git_tracking.test.cjs'
      - 'remote_portal/tests/native_gui_git_pull_review.test.cjs'
      - 'remote_portal/tests/native_gui_git_review_invalidation.test.cjs'
      - 'remote_portal/tests/native_gui_git_pull_task_snapshot.test.cjs'
      - 'remote_portal/tests/native_gui_files_root.test.cjs'
      - 'remote_portal/tests/native_gui_git_patch.test.cjs'
      - 'remote_portal/tests/native_gui_git_branch_create.test.cjs'
      - 'remote_portal/tests/native_gui_git_switch.test.cjs'
      - 'remote_portal/tests/native_gui_git_branch_delete.test.cjs'
      - 'remote_portal/tests/native_gui_terminal.test.cjs'
      - 'remote_portal/tests/native_gui_terminal_auto_read.test.cjs'
      - 'vscode_tasks_menu_go/internal/config/**'
      - 'vscode_tasks_menu_go/internal/server/**'
      - 'vscode_tasks_menu_go/cmd/vscode_tasks_menu/**'
      - 'vscode_tasks_menu_go/cmd/taskdeck_remote_login/**'
      - 'vscode_tasks_menu_go/cmd/taskdeck_remote_probe/**'
      - 'vscode_tasks_menu_go/cmd/taskdeck_remote_relay/**'
      - 'vscode_tasks_menu_go/web/featuremods/remotehelp.js'
      - 'vscode_tasks_menu_go/web/featuremods/help.js'
      - 'vscode_tasks_menu_go/test_settings_help.cjs'
      - 'vscode_tasks_menu_go/web/featuremods/remoteaccess.js'
      - 'vscode_tasks_menu_go/web/featuremods/menus.js'
      - 'vscode_tasks_menu_go/web/featuremods/next.js'
      - 'deploy/remote/verify_client.sh'
      - 'tests/test_remote_client_provenance.sh'
      - '.github/workflows/taskdeck_remote_client_provenance.yml'
      - '.github/workflows/taskdeck_remote_portal.yml'
      - '.github/workflows/taskdeck_remote_agent.yml'
  pull_request:
    paths:
      - 'vscode_tasks_menu_go/**'
      - 'remote_portal/tests/native_gui_task_*.test.cjs'
      - 'remote_portal/tests/native_gui_two_picks.test.cjs'
      - 'remote_portal/tests/native_gui_long_task*.test.cjs'
      - 'remote_portal/tests/native_gui_git_commit.test.cjs'
      - 'remote_portal/tests/native_gui_git_push.test.cjs'
      - 'remote_portal/tests/native_gui_git_fetch.test.cjs'
      - 'remote_portal/tests/native_gui_git_index.test.cjs'
      - 'remote_portal/tests/native_gui_git_file.test.cjs'
      - 'remote_portal/tests/native_gui_git_branches.test.cjs'
      - 'remote_portal/tests/native_gui_git_remotes.test.cjs'
      - 'remote_portal/tests/native_gui_git_tracking.test.cjs'
      - 'remote_portal/tests/native_gui_git_pull_review.test.cjs'
      - 'remote_portal/tests/native_gui_git_review_invalidation.test.cjs'
      - 'remote_portal/tests/native_gui_git_pull_task_snapshot.test.cjs'
      - 'remote_portal/tests/native_gui_files_root.test.cjs'
      - 'remote_portal/tests/native_gui_git_patch.test.cjs'
      - 'remote_portal/tests/native_gui_git_branch_create.test.cjs'
      - 'remote_portal/tests/native_gui_git_switch.test.cjs'
      - 'remote_portal/tests/native_gui_git_branch_delete.test.cjs'
      - 'remote_portal/tests/native_gui_terminal.test.cjs'
      - 'remote_portal/tests/native_gui_terminal_auto_read.test.cjs'
      - 'deploy/remote/verify_client.sh'
      - 'tests/test_remote_client_provenance.sh'
      - '.github/workflows/taskdeck_remote_client_provenance.yml'
      - '.github/workflows/taskdeck_remote_portal.yml'
      - '.github/workflows/taskdeck_remote_agent.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-agent-go:
    runs-on: ubuntu-latest
    # Full race-enabled workflow, Git, Relay and HTTP security suites can
    # exceed 12 minutes even when every test passes. Do not cancel a
    # release validation job while the final security suite is running.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: vscode_tasks_menu_go/go.mod
      - name: Native client provenance verifier negative tests
        run: bash tests/test_remote_client_provenance.sh
      - name: Go test identity and protocol
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/remoteclientkey ./internal/remoteportal ./internal/remoterelay ./internal/remotetransport ./cmd/taskdeck_remote_probe ./cmd/taskdeck_remote_login ./cmd/taskdeck_remote_relay
      - name: Preflight Git HTTPS TLS, redirect and credential hardening
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run 'TestRemoteGitNetworkMutations(NeverExecuteRepositoryCredentialHelpers|RejectHTTPSRedirects)' -count=1 -timeout=90s
      - name: Preflight Git Commit post-audit HEAD, branch, index and filter drift
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run '^TestRemoteGitCommitPostAuditRejectsIndexBranchHEADAndFilterDrift
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run 'TestRemoteGit(PostAudit|MutationActiveCommand|MutationLiveRBAC|Commit(AuditRevocationCannotMutateHEAD|RejectsRoleRevokedDuringAttemptAudit))' -count=1 -timeout=90s
      - name: Preflight Unix PTY consent, rolling output and final drain
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run 'TestRemoteTerminal(OpenRejectsHostRoleRevokedDuringAudit|ActivePTYStopsOnHostOptOutOrRoleDowngrade|NaturalExitRetainsFinalPTYOutput|RollingCapture)' -count=1 -timeout=90s
      - name: Preflight deferred Terminal E2EE output cursor and seal rejection
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run 'TestRemoteTerminal(E2EEFailedSealPreservesOutputCursor|DeferredCursorDoesNotOverwriteNewerRead)' -count=1 -timeout=90s
      - name: Preflight long task finalizing, workspace release and Poll cursor safety
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run 'TestRemoteLongTask(FinalStateWaitsForWorkspaceRelease|PollTimeoutRechecksCaptureAndAdvancesCursor|DeferredPollOnlyConsumesAfterAuthenticatedSeal|DeferredPollTimeoutPreservesOutput|E2EEFailedSealPreservesOutputCursor)' -count=1 -timeout=90s
      - name: Preflight Git mutation only after completed task releases workspace
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run 'TestRemoteGit(AllowsCompletedRetainedTaskOnlyAfterWorkspaceRelease|RetainedJobWithInvalidDoneOrStatusDenied)' -count=1 -timeout=90s
      - name: Verify main's offline Pull review via authenticated GitStatus E2EE
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/remotetransport ./internal/server ./cmd/taskdeck_remote_login -run 'Test(RemoteGitPullReview|TrustedGUIGitPullReview)' -count=1 -timeout=90s
      - name: Verify project notebook CRUD, isolation and UI contracts
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run '^TestProjectNotes' -count=1 -timeout=90s
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Help Remote installation guide, tabs, search and command copy
        working-directory: vscode_tasks_menu_go
        run: |
          node --check web/featuremods/remotehelp.js
          node --check web/featuremods/help.js
          node --test test_settings_help.cjs
      - name: Check Remote browser and administrative Settings JavaScript syntax
        run: |
          node --check remote_portal/public/remote_probe.js
          node --check remote_portal/public/remote_crypto.js
          node --check vscode_tasks_menu_go/web/featuremods/remoteaccess.js
          node --check vscode_tasks_menu_go/web/featuremods/remote_workspace.js
          node --check vscode_tasks_menu_go/web/featuremods/projectnotes.js
      - name: Verify bundled native Remote GUI JavaScript is trusted and parses
        run: node remote_portal/tests/native_gui_assets.test.cjs
      - name: Exercise native GUI session expiry and concurrent disconnect in browser
        run: node remote_portal/tests/native_gui_interactions.test.cjs
      - name: Verify trusted native task selection and E2EE ID-only GUI
        run: node remote_portal/tests/native_gui_task_inspect.test.cjs
      - name: Verify principal-owned E2EE task outcome reports and GUI logout cleanup
        run: node remote_portal/tests/native_gui_task_report.test.cjs
      - name: Verify E2EE Task dependency DAG inspection and host opt-out GUI
        run: node remote_portal/tests/native_gui_task_dependencies.test.cjs
      - name: Verify strict dependency graph codec, host snapshot and workflow safety
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/remotetransport ./internal/server -run 'TestRemoteTaskDependencies' -count=1 -timeout=120s
      - name: Preflight short Task host opt-in, post-audit and active TasksRun revocation
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run 'TestRemoteShortTask(PostAudit(RevocationPreventsExecution|SnapshotDriftRejectsExecution)|LiveGuardStopsActiveProcessAfterHostOptOut|LiveGuardStopsActiveProcessAfterRoleDowngrade|GuardPreservesNormalNonzeroExit)' -count=1 -timeout=90s
      - name: Preflight long Task post-audit source and active host TasksRun revocation
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run 'TestRemoteLongTask(PostAuditOptOutAndRoleDowngradeNeverLaunch|PostAuditSourceAndCwdDriftNeverLaunch|ActiveProcessStopsAfterHostOptOut|ActiveProcessStopsAfterRoleDowngrade|LiveGuardPreservesOrdinaryNonzeroExit)' -count=1 -timeout=90s
      - name: Preflight native GUI workflow progress shape and lifecycle continuity
        run: node remote_portal/tests/native_gui_long_task_lifecycle.test.cjs
      - name: Preflight five-step sequential and four-leaf parallel E2EE DAGs
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/remotetransport ./internal/server -run 'TestRemote(LongTaskFiveStep(Sequential|Parallel)EscapedE2EEBounds|TaskDependenciesSequentialDAGCodecBounds|Workflow(FiveStepSequentialJoinE2EE|FourParallelLeavesSingleJoin|ChunkLimitSameAcrossPollPaths))' -count=1 -timeout=90s
      - name: Preflight serial prelude and parallel join with independently revoked host opt-in
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run 'TestRemoteWorkflow(SerialPreludeThenParallelJoin|ParallelPrefix(RequiresExtraHostOptIn|FailureStopsAllBranches|LiveOptOutStopsPrerequisite|AuditDriftStopsBeforeExecution))' -count=1 -timeout=90s
      - name: Preflight parallel worker per-launch source, env, executable and cwd guard
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run 'TestRemoteParallelLaunch' -count=1 -timeout=90s
      - name: Preflight bounded two-prelude fork join and independent host revocation
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run 'TestRemoteWorkflowDoublePrefix' -count=1 -timeout=90s
      - name: Verify ID-only linear workflow execution, failure, cancellation and audit
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run 'TestRemoteWorkflow' -count=1 -timeout=150s
      - name: Verify task report audit isolation, permissions and strict codec
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/remotetransport ./internal/server -run 'TestRemoteTaskReport' -count=1 -timeout=90s
      - name: Verify trusted native bounded task run controls
        run: node remote_portal/tests/native_gui_task_run.test.cjs
      - name: Verify task stop revokes native E2EE and scrubs late results
        run: node remote_portal/tests/native_gui_task_stop.test.cjs
      - name: Verify bounded process-only prompt input from native GUI
        run: node remote_portal/tests/native_gui_task_prompt.test.cjs
      - name: Verify fixed-choice native GUI task selection
        run: node remote_portal/tests/native_gui_task_pick.test.cjs
      - name: Verify two fixed pickString inputs and index-only native UI
        run: node remote_portal/tests/native_gui_two_picks.test.cjs
      - name: Verify native GUI long task progress and independent cancellation
        run: node remote_portal/tests/native_gui_long_task.test.cjs
      - name: Verify native Task and Terminal UTF-8 byte caps, Unicode and logout scrubbing
        run: node remote_portal/tests/native_gui_long_task_utf8_history.test.cjs
      - name: Reject stale or regressed native GUI task lifecycle responses
        run: node remote_portal/tests/native_gui_long_task_lifecycle.test.cjs
      - name: Keep live task output scroll position across authenticated Polls
        run: node remote_portal/tests/native_gui_long_task_scroll_follow.test.cjs
      - name: Preserve pending cancellation across intermediate running job polls
        run: node remote_portal/tests/native_gui_long_task_cancel_pending.test.cjs
      - name: Verify bounded automatic long-task polling and reserved cancellation quota
        run: node remote_portal/tests/native_gui_long_task_autopoll.test.cjs
      - name: Verify opt-in Terminal automatic E2EE output draining and Close quota
        run: node remote_portal/tests/native_gui_terminal_auto_read.test.cjs
      - name: Git pull invalidates old authenticated task selection while retaining output
        run: node remote_portal/tests/native_gui_git_pull_task_snapshot.test.cjs
      - name: Verify explicit GUI bulk task paging stop, quota and disconnect
        run: node remote_portal/tests/native_gui_bulk_task_pages.test.cjs
      - name: Verify bounded native Git commit message and explicit confirmation
        run: node remote_portal/tests/native_gui_git_commit.test.cjs
      - name: Verify opt-in, no-force native Git push confirmation
        run: node remote_portal/tests/native_gui_git_push.test.cjs
      - name: Verify host-upstream-only native Git fetch confirmation
        run: node remote_portal/tests/native_gui_git_fetch.test.cjs
      - name: Verify trusted Git stage and unstage GUI confirmation
        run: node remote_portal/tests/native_gui_git_index.test.cjs
      - name: Verify Git status snapshot selection for one tracked file
        run: node remote_portal/tests/native_gui_git_file.test.cjs
      - name: Verify fixed read-only native Git branches
        run: node remote_portal/tests/native_gui_git_branches.test.cjs
      - name: Verify bounded names-only native Git remote metadata
        run: node remote_portal/tests/native_gui_git_remotes.test.cjs
      - name: Verify host-owned tracking ref pagination in trusted native GUI
        run: node remote_portal/tests/native_gui_git_tracking.test.cjs
      - name: Verify offline Git Pull review is not a Git write permission
        run: node remote_portal/tests/native_gui_git_pull_review.test.cjs
      - name: Verify paged Files root native E2EE GUI and logout cleanup
        run: node remote_portal/tests/native_gui_files_root.test.cjs
      - name: Verify host-selected E2EE file content pages and strict no-follow reads
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/remotetransport ./internal/server -run 'TestRemote(FilesRoot|FileRead|FilesRead|FilesDir)' -count=1 -timeout=120s
      - name: Verify bounded Git patch pagination native GUI
        run: node remote_portal/tests/native_gui_git_patch.test.cjs
      - name: Verify host-fixed Git branch create native GUI confirmation
        run: node remote_portal/tests/native_gui_git_branch_create.test.cjs
      - name: Verify host-fixed same-HEAD Git branch switch GUI confirmation
        run: node remote_portal/tests/native_gui_git_switch.test.cjs
      - name: Verify reviewed TaskDeck branch delete confirmation and logout
        run: node remote_portal/tests/native_gui_git_branch_delete.test.cjs
      - name: Verify short-lived E2EE native Terminal PTY controls
        run: node remote_portal/tests/native_gui_terminal.test.cjs
      - name: Test Go-Agent-to-browser E2EE interoperability
        run: node remote_portal/tests/browser_crypto.test.cjs
      - name: Test bidirectional Go-Agent/WebCrypto echo protocol
        run: node remote_portal/tests/browser_echo_crypto.test.cjs
      - name: Test encrypted browser login codec Go-WebCrypto interoperability
        run: node remote_portal/tests/browser_login_crypto.test.cjs
      - name: Ensure PHP page cannot render a TaskDeck password entry form
        run: node remote_portal/tests/credential_boundary.test.cjs
      - name: Verify host-fixed Git branch create E2EE and repository safety
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/remotetransport ./internal/server -run 'TestRemoteGitBranchCreate|TestRemoteFeaturesAllEnabled' -count=1 -timeout=90s
      - name: Verify ported Git remotes E2EE names-only and host audit
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/remotetransport ./internal/server ./cmd/taskdeck_remote_login -run 'Test(RemoteGitRemotes|TrustedGUIGitRemotes)' -count=1
      - name: Verify paged offline Git tracking refs and snapshot rejection
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/remotetransport ./internal/server ./cmd/taskdeck_remote_login -run 'Test(RemoteGitTracking|TrustedGUIGitTracking)' -count=1 -timeout=90s
      - name: Git index and HEAD mutations retire stale native diff and branch reviews
        run: node remote_portal/tests/native_gui_git_review_invalidation.test.cjs
      - name: Verify fixed Git branches protocol and real-repository safeguards first
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/remotetransport ./internal/server -run 'TestRemoteGitBranches' -count=1 -timeout=90s
      - name: Verify bounded Git pull, commit, push, fetch, branches, patch, per-file index, log and diff
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/remotetransport ./internal/server -run 'TestRemoteGit(Pull|Commit|Push|Fetch|BranchCreate|BranchDelete|Switch|Branches|Patch|Index|File|Stage|Log|Diff)' -count=1 -timeout=3m
      - name: Verify staged E2EE native and Relay mailbox integration
        working-directory: vscode_tasks_menu_go
        # Fast focused preflight before the larger source-wide security suite.
        # Bounded fixed E2EE task and Git operations only; no generic shell,
        # arbitrary Git RPC, file proxy or Terminal route is mounted here.
        run: go test -race ./internal/remoterelay ./internal/remotetransport ./internal/server -run 'Test(AppMailbox|PingClient|RemoteOpaqueRelayMailbox|RealWSSAppPing|RemoteGitStatus|RemoteProjectInfo|RemoteTasksPreview|RemoteTaskPagination|RemoteTaskNext|RemoteTaskPaging|RemoteTasksNext|RemoteFeatures|RemoteInspect|PrepareRemoteTask|RemoteTaskSourceDigest)' -count=1
      - name: Verify bounded Unix PTY terminal, revocation and strict E2EE schema
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/remotetransport ./internal/server -run 'TestRemoteTerminal' -count=1 -timeout=3m
      - name: Red-team compromised PHP and Relay never become TaskDeck principals
        working-directory: vscode_tasks_menu_go
        # Tests a hacked PHP signing key, forged roles, a real local
        # password, copied host-approved public keys, and key revocation.
        run: go test -race ./internal/server -run 'Test(Compromised|RemoteCompromised)' -count=1 -timeout=4m
      - name: Go test Remote configuration
        working-directory: vscode_tasks_menu_go
        run: go test ./internal/config -run 'TestRemote|TestSetRemoteSettings'
      - name: Go test Remote HTTP, UI and encrypted login probe security
        working-directory: vscode_tasks_menu_go
        # Run *all* remote threat-model tests, including names that do not
        # begin with TestRemote. Previously TestCompromisedPortal* (stolen
        # password, forged Portal admin ticket, revoked client key, etc.)
        # were silently omitted from this mandatory release job.
        run: go test -race ./internal/server -run 'Test(Remote|EncryptedTaskDeckLogin|Compromised|TaskDeckSessionBindsExactPinnedAgent|DirectSharedRemoteHandler)' -count=1
      - name: Go test TaskDeck host-only remote client-key CLI
        working-directory: vscode_tasks_menu_go
        run: go test -race ./cmd/vscode_tasks_menu -run TestHostRemoteKeyCLI -count=1
      - name: Compile server and daemon packages
        working-directory: vscode_tasks_menu_go
        run: go test -run TestNoTestsRequested ./internal/server ./cmd/vscode_tasks_menu
      - name: Build Relay executable
        working-directory: vscode_tasks_menu_go
        run: go build ./cmd/taskdeck_remote_relay
      - name: Build developer probe
        working-directory: vscode_tasks_menu_go
        run: go build ./cmd/taskdeck_remote_probe
      - name: Build trusted local login-only client
        working-directory: vscode_tasks_menu_go
        run: go build ./cmd/taskdeck_remote_login
      - name: Cross-compile Remote Agent and Relay for macOS and Linux ARM
        working-directory: vscode_tasks_menu_go
        run: |
          for target in darwin/arm64 darwin/amd64 linux/arm64; do
            export GOOS="${target%/*}"
            export GOARCH="${target#*/}"
            export CGO_ENABLED=0
            go build ./internal/remoteclientkey ./internal/remoteportal ./internal/remoterelay ./internal/remotetransport
            go build -o "${RUNNER_TEMP}/taskdeck-relay-${GOOS}-${GOARCH}" ./cmd/taskdeck_remote_relay
            go build -o "${RUNNER_TEMP}/taskdeck-login-${GOOS}-${GOARCH}" ./cmd/taskdeck_remote_login
            echo "PASS: Remote Agent/Relay portable build for ${target}"
          done
 -count=1 -timeout=90s
      - name: Preflight Git post-audit and in-flight host GitWrite revocation
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run 'TestRemoteGit(PostAudit|MutationActiveCommand|MutationLiveRBAC|Commit(AuditRevocationCannotMutateHEAD|RejectsRoleRevokedDuringAttemptAudit))' -count=1 -timeout=90s
      - name: Preflight Unix PTY consent, rolling output and final drain
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run 'TestRemoteTerminal(OpenRejectsHostRoleRevokedDuringAudit|ActivePTYStopsOnHostOptOutOrRoleDowngrade|NaturalExitRetainsFinalPTYOutput|RollingCapture)' -count=1 -timeout=90s
      - name: Preflight deferred Terminal E2EE output cursor and seal rejection
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run 'TestRemoteTerminal(E2EEFailedSealPreservesOutputCursor|DeferredCursorDoesNotOverwriteNewerRead)' -count=1 -timeout=90s
      - name: Preflight long task finalizing, workspace release and Poll cursor safety
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run 'TestRemoteLongTask(FinalStateWaitsForWorkspaceRelease|PollTimeoutRechecksCaptureAndAdvancesCursor|DeferredPollOnlyConsumesAfterAuthenticatedSeal|DeferredPollTimeoutPreservesOutput|E2EEFailedSealPreservesOutputCursor)' -count=1 -timeout=90s
      - name: Preflight Git mutation only after completed task releases workspace
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run 'TestRemoteGit(AllowsCompletedRetainedTaskOnlyAfterWorkspaceRelease|RetainedJobWithInvalidDoneOrStatusDenied)' -count=1 -timeout=90s
      - name: Verify main's offline Pull review via authenticated GitStatus E2EE
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/remotetransport ./internal/server ./cmd/taskdeck_remote_login -run 'Test(RemoteGitPullReview|TrustedGUIGitPullReview)' -count=1 -timeout=90s
      - name: Verify project notebook CRUD, isolation and UI contracts
        working-directory: vscode_tasks_menu_go
        run: go test -race ./internal/server -run '^TestProjectNotes' -count=1 -timeout=90s
