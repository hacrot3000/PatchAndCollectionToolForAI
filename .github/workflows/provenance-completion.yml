name: Complete provenance signature trust
on:
  push:
    branches: [ptv-provenance-signature-trust]
    paths: [.github/workflows/provenance-completion.yml]
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ptv-provenance-signature-trust
          fetch-depth: 0
      - name: Complete gates, run full regression, commit and merge
        shell: bash
        run: |
          set -euo pipefail
          python3 .ptv_work/provenance_completion.py
          python3 _patch_lib/python_patch_release_metadata.py --tool-dir .
          rm -rf /tmp/ptv-provenance-final
          mkdir -p /tmp/ptv-provenance-final/tools
          python3 -c 'from pathlib import Path; import shutil,sys; sys.path.insert(0,str(Path("_patch_lib").resolve())); from python_patch_release_metadata import managed_relpaths; src=Path(".").resolve(); project=Path("/tmp/ptv-provenance-final"); rows=managed_relpaths(src); [(lambda rel,s,d:(d.parent.mkdir(parents=True,exist_ok=True),shutil.copy2(s,d)))(rel,src/Path(rel).relative_to("tools"),project/rel) for rel in rows]; shutil.copy2(src/"_patch_lib/SHA256SUMS",project/"tools/_patch_lib/SHA256SUMS"); (project/"tools/run_python_patches.sh").chmod(0o755)'
          export PYTHONDONTWRITEBYTECODE=1
          export NO_COLOR=1
          cd /tmp/ptv-provenance-final/tools
          python3 _patch_lib/self_test_provenance_signature_v6_21_0.py
          python3 _patch_lib/self_test_ai_sync_v6_20_0.py
          python3 _patch_lib/self_test_docs_v6_20_0.py
          python3 _patch_lib/self_test_capability_ledger_v6_20_0.py
          python3 _patch_lib/self_test_self_contained_v6_20_0.py
          python3 _patch_lib/self_test_tool_health_v6_20_0.py
          python3 _patch_lib/self_test_package_checksums_v6_20_0.py
          python3 _patch_lib/self_test_python_patch_tool_v6_20_0.py
          cd "$GITHUB_WORKSPACE"
          rm -f .ptv_work/PROGRESS.md .ptv_work/provenance_completion.py .github/workflows/provenance-completion.yml
          rmdir .ptv_work 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'Patch Tool CI'
          git config user.email 'patch-tool-ci@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete local Ed25519 PATCH provenance trust'
          git push origin HEAD:ptv-provenance-signature-trust
          FEATURE_HEAD=$(git rev-parse HEAD)
          git fetch origin main
          EXPECTED_MAIN=1341aa53a8c93831a18eeb74f5d362aaa19e80c8
          ACTUAL_MAIN=$(git rev-parse origin/main)
          test "$ACTUAL_MAIN" = "$EXPECTED_MAIN" || { echo "main diverged: $ACTUAL_MAIN" >&2; exit 31; }
          git checkout -B main origin/main
          git merge --squash "$FEATURE_HEAD"
          git commit -m 'feat: add local Ed25519 PATCH provenance trust'
          git push origin HEAD:main
