name: TaskDeck COLLECT command and PATCH command History
on:
  push:
    branches: [main]
    paths:
      - '_patch_lib/**'
      - 'vscode_tasks_menu_go/internal/session/protocol.go'
      - 'vscode_tasks_menu_go/internal/session/session.go'
      - 'vscode_tasks_menu_go/internal/session/command_journal.go'
      - 'vscode_tasks_menu_go/internal/session/command_journal_test.go'
      - 'vscode_tasks_menu_go/internal/session/item_protocol_test.go'
      - 'vscode_tasks_menu_go/internal/server/patchpanel_ui_test.go'
      - 'vscode_tasks_menu_go/web/featuremods/patchpanel.js'
      - '.github/workflows/taskdeck_patch_command_history.yml'
  pull_request:
    paths:
      - '_patch_lib/**'
      - 'vscode_tasks_menu_go/internal/session/protocol.go'
      - 'vscode_tasks_menu_go/internal/session/session.go'
      - 'vscode_tasks_menu_go/internal/session/command_journal.go'
      - 'vscode_tasks_menu_go/internal/session/command_journal_test.go'
      - 'vscode_tasks_menu_go/internal/session/item_protocol_test.go'
      - 'vscode_tasks_menu_go/internal/server/patchpanel_ui_test.go'
      - 'vscode_tasks_menu_go/web/featuremods/patchpanel.js'
      - '.github/workflows/taskdeck_patch_command_history.yml'
permissions:
  contents: read
jobs:
  collect-patch-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: false
      - name: Syntax and whitelist-only COLLECT
        run: |
          python3 -m compileall -q _patch_lib
          PYTHONDONTWRITEBYTECODE=1 python3 -B -S _patch_lib/self_test_collect_command_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B -S _patch_lib/self_test_collect_historical_actions_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B -S _patch_lib/self_test_ai_collect_contract_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B -S _patch_lib/self_test_local_readonly_whitelist_v6_20_0.py
      - name: Durable per-command console and History
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B -S _patch_lib/self_test_patch_command_history_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B -S _patch_lib/self_test_live_command_state_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B -S _patch_lib/self_test_script_origin_guard_v6_20_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B -S _patch_lib/self_test_remote_ssh_v6_20_0.py
      - name: Repository source integrity and release manifest hashes
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          repo = Path.cwd()
          sha_file = repo / "_patch_lib" / "SHA256SUMS"
          package_contents = (repo / "_patch_lib" / "PACKAGE_CONTENTS.txt").read_text()
          seen = set()
          present = 0
          missing_release_only = []
          mismatches = []
          for row in sha_file.read_text().splitlines():
              if not row.strip():
                  continue
              expected, rel = row.split(None, 1)
              rel = rel.lstrip("*").strip()
              assert len(expected) == 64 and rel not in seen, rel
              seen.add(rel)
              assert rel.startswith("tools/"), rel
              source = repo / rel.removeprefix("tools/")
              if not source.is_file():
                  if rel.startswith("tools/_patch_lib/"):
                      raise FileNotFoundError(rel)
                  missing_release_only.append(rel)
                  continue
              actual = hashlib.sha256(source.read_bytes()).hexdigest()
              if actual != expected:
                  mismatches.append(rel)
                  print(f"CHECKSUM_REPAIR: {actual}  {rel}")
              assert rel in package_contents, f"missing from release index: {rel}"
              present += 1
          mandatory = {
              "tools/_patch_lib/python_patch_collect_commands.py",
              "tools/_patch_lib/self_test_collect_command_v6_20_0.py",
              "tools/_patch_lib/self_test_patch_command_history_v6_20_0.py",
              "tools/_patch_lib/python_patch_runner.py",
              "tools/_patch_lib/python_patch_queue_dispatcher.py",
          }
          assert mandatory <= seen, sorted(mandatory - seen)
          assert not mismatches, f"Stale source checksums: {len(mismatches)} (see CHECKSUM_REPAIR lines above)"
          print(f"PASS: {present} repo-present source hashes; optional installer-generated files not checked: {len(missing_release_only)}")
          if missing_release_only:
              print("Installer-generated members absent from GitHub source tree:", *missing_release_only[:12], sep="\n - ")
          PY
      - name: UI and Go session protocol
        run: |
          node --check vscode_tasks_menu_go/web/featuremods/patchpanel.js
          cd vscode_tasks_menu_go
          go test -count=1 -run '^TestRemoteWhitelist' ./internal/patchsshpolicy
          go test -count=1 -run 'TestProtocolItem|TestProtocolCommandJournal|TestPatchPanel' ./internal/session ./internal/server
