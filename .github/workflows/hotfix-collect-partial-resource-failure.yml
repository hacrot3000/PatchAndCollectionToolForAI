name: hotfix-collect-partial-resource-failure
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-collect-partial-resource-failure.yml
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f0d6f845d6d7f5968de0fe9d6b25c8a35dc0d41b"
      - name: Patch partial resource-failure preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          compat=Path('_patch_lib/python_patch_collect_compat.py')
          s=compat.read_text(encoding='utf-8')

          marker='\n\nclass ResultBuilder:\n'
          assert s.count(marker)==1, s.count(marker)
          helper='''\n\n_RESOURCE_PARTIAL_MARKERS = (\n    "timeout", "timed out", "time limit", "safety cap",\n    "max_file_bytes", "max_files", "max_total_bytes", "max_report_bytes",\n    "collection exceeds", "exceeds max_file_bytes", "exceeds max_files",\n    "exceeds max_total_bytes", "too large", "output quota",\n)\n\ndef _is_resource_partial_reason(value: object) -> bool:\n    text = str(value or "").lower()\n    return any(marker in text for marker in _RESOURCE_PARTIAL_MARKERS)\n\ndef _is_recoverable_resource_failure(exc: BaseException) -> bool:\n    if isinstance(exc, subprocess.TimeoutExpired):\n        return True\n    return _is_resource_partial_reason(f"{type(exc).__name__}: {exc}")\n'''
          s=s.replace(marker,helper+marker,1)

          old='''        self.collection_warnings: list[dict[str, object]] = []\n        self.collection_status = "PASS"\n'''
          assert s.count(old)==1, s.count(old)
          new='''        self.collection_warnings: list[dict[str, object]] = []\n        self.collection_status = "PASS"\n        self.resource_incomplete = False\n        self._resource_handoff_actions: set[tuple[int, str]] = set()\n'''
          s=s.replace(old,new,1)

          old='''    def mark_incomplete(self, *, action: int, kind: str, reasons: list[str]) -> None:\n        self.collection_status = "INCOMPLETE"\n        self.collection_warnings.append({"action": action, "type": kind, "reasons": list(reasons)})\n\n    def finish(self) -> Path:\n'''
          assert s.count(old)==1, s.count(old)
          new='''    def mark_incomplete(self, *, action: int, kind: str, reasons: list[str]) -> None:\n        clean_reasons = list(dict.fromkeys(str(x) for x in reasons if str(x)))\n        self.collection_status = "INCOMPLETE"\n        self.collection_warnings.append({"action": action, "type": kind, "reasons": clean_reasons})\n        resource_reasons = [x for x in clean_reasons if _is_resource_partial_reason(x)]\n        if resource_reasons:\n            self.resource_incomplete = True\n            key = (int(action), str(kind))\n            if key not in self._resource_handoff_actions:\n                self._resource_handoff_actions.add(key)\n                safe_kind = _safe_id(kind)\n                arc_base = f"handoff/COLLECT_INCOMPLETE_HANDOFF_{int(action):03d}_{safe_kind}"\n                payload = {\n                    "format": "python-patch-tool-collect-incomplete-handoff",\n                    "format_version": 1,\n                    "tool_version": VERSION,\n                    "request_id": self.request_data.get("id"),\n                    "action": int(action),\n                    "type": str(kind),\n                    "status": "INCOMPLETE",\n                    "reason_class": "resource_limit_or_timeout",\n                    "reasons": resource_reasons,\n                    "files_collected_so_far": self.file_count,\n                    "file_bytes_collected_so_far": self.total_bytes,\n                    "reports_completed_so_far": len(self.reports),\n                    "policy": "preserve partial result when at least one file is collected; publish no result when zero files were collected",\n                }\n                self.zf.writestr(arc_base + ".json", json.dumps(payload, ensure_ascii=False, indent=2) + "\\n")\n                text = [\n                    "COLLECT INCOMPLETE HANDOFF",\n                    f"Request: {self.request_data.get('id') or 'collect'}",\n                    f"Action : {int(action)} [{kind}]",\n                    "Status : INCOMPLETE",\n                    "Cause  : resource limit / timeout",\n                    f"Files preserved so far: {self.file_count}",\n                    f"Bytes preserved so far: {self.total_bytes}",\n                    "",\n                    "Reasons:",\n                    *[f"- {x}" for x in resource_reasons],\n                    "",\n                    "Policy: partial evidence is intentionally preserved when at least one file has already been collected.",\n                ]\n                self.zf.writestr(arc_base + ".txt", "\\n".join(text) + "\\n")\n\n    def finish(self) -> Path:\n'''
          s=s.replace(old,new,1)

          old='''            "collection_status": self.collection_status,\n            "collection_warnings": self.collection_warnings,\n            "ai_tool_sync": self.ai_sync_manifest,\n'''
          assert s.count(old)==1, s.count(old)
          new='''            "collection_status": self.collection_status,\n            "collection_warnings": self.collection_warnings,\n            "resource_incomplete": self.resource_incomplete,\n            "ai_tool_sync": self.ai_sync_manifest,\n'''
          s=s.replace(old,new,1)

          old='''            collection_status = builder.collection_status\n            result = builder.finish()\n'''
          assert s.count(old)==1, s.count(old)
          new='''            if builder.resource_incomplete and builder.file_count <= 0:\n                raise ValueError("resource-limited collection produced no collected files; no partial result is published")\n            collection_status = builder.collection_status\n            result = builder.finish()\n'''
          s=s.replace(old,new,1)

          old='''        except Exception:\n            builder.abort()\n            raise\n    finally:\n        input_temp.cleanup()\n'''
          assert s.count(old)==1, s.count(old)
          new='''        except Exception as exc:\n            if builder.file_count > 0 and _is_recoverable_resource_failure(exc):\n                failed_action = int(locals().get("index", 0) or 0)\n                failed_kind = str(locals().get("kind", "collect"))\n                message = _redact_text(str(exc))[:2000]\n                builder.mark_incomplete(\n                    action=failed_action,\n                    kind=failed_kind,\n                    reasons=[\n                        f"{type(exc).__name__}: {message}",\n                        f"resource failure occurred after {builder.file_count} file(s) were already collected; partial result preserved",\n                    ],\n                )\n                result = builder.finish()\n                try:\n                    archived, lifecycle = _archive_request(root, request_zip, execution_request, request_sha)\n                except Exception:\n                    try: result.unlink()\n                    except OSError: pass\n                    try: result.with_suffix(".txt").unlink()\n                    except OSError: pass\n                    raise\n                return result, archived, max(0, failed_action - 1), lifecycle, "INCOMPLETE"\n            builder.abort()\n            raise\n    finally:\n        input_temp.cleanup()\n'''
          s=s.replace(old,new,1)
          compat.write_text(s,encoding='utf-8')

          worker=Path('_patch_lib/python_patch_collect_regex_worker.py')
          w=worker.read_text(encoding='utf-8')
          marker='\n\ndef main(argv=None) -> int:\n'
          assert w.count(marker)==1, w.count(marker)
          helper='''\n\ndef _bounded_payload_json(payload: dict, limits: dict) -> str:\n    """Keep worker IPC bounded while preserving a useful PARTIAL search result."""\n    hard = max(int(limits.get("max_report_bytes", 0) or 0), 1024 * 1024) * 2\n    def dump(value: dict) -> str:\n        return json.dumps(value, ensure_ascii=False)\n    raw = dump(payload)\n    original_bytes = len(raw.encode("utf-8"))\n    if original_bytes <= hard:\n        return raw\n\n    out = dict(payload)\n    details = list(out.get("match_details") or [])\n    reasons = list(out.get("reasons") or [])\n    cap_reason = f"regex search worker result exceeded safety cap ({original_bytes} bytes); bounded partial details preserved"\n    reasons.append(cap_reason)\n    out["reasons"] = list(dict.fromkeys(str(x) for x in reasons))\n    out["incomplete"] = True\n    out["coverage_status"] = "PARTIAL"\n    out["execution_status"] = "PARTIAL"\n    out["worker_result_truncated"] = True\n    out["match_details_total_before_worker_cap"] = len(details)\n\n    keep = min(len(details), 512)\n    while True:\n        out["match_details"] = details[:keep]\n        raw = dump(out)\n        if len(raw.encode("utf-8")) <= hard or keep <= 0:\n            break\n        keep //= 2\n\n    if len(raw.encode("utf-8")) > hard:\n        report = str(out.get("report") or "")\n        out["report"] = report[:max(4096, hard // 4)] + "\\n\\n[PTV: report truncated to keep regex worker result within safety cap]\\n"\n        out["coverage"] = {"worker_result_truncated": True}\n        raw = dump(out)\n    if len(raw.encode("utf-8")) > hard:\n        out["report"] = str(out.get("report") or "")[:4096] + "\\n[PTV: report heavily truncated by worker safety cap]\\n"\n        out["match_details"] = []\n        raw = dump(out)\n    if len(raw.encode("utf-8")) > hard:\n        raise ValueError(f"cannot bound regex worker partial payload below safety cap ({len(raw.encode('utf-8'))} > {hard})")\n    out["match_details_preserved_after_worker_cap"] = len(out.get("match_details") or [])\n    return dump(out)\n'''
          w=w.replace(marker,helper+marker,1)
          old='''        def checkpoint(payload):\n            _atomic_text(result, json.dumps(payload, ensure_ascii=False))\n        payload = _search_action_payload(root, data["action"], data["limits"], deadline=deadline, checkpoint_cb=checkpoint)\n        _atomic_text(result, json.dumps(payload, ensure_ascii=False))\n'''
          assert w.count(old)==1, w.count(old)
          new='''        def checkpoint(payload):\n            _atomic_text(result, _bounded_payload_json(payload, data["limits"]))\n        payload = _search_action_payload(root, data["action"], data["limits"], deadline=deadline, checkpoint_cb=checkpoint)\n        _atomic_text(result, _bounded_payload_json(payload, data["limits"]))\n'''
          w=w.replace(old,new,1)
          worker.write_text(w,encoding='utf-8')

          test=Path('_patch_lib/self_test_search_partial_timeout_v6_20_0.py')
          x=test.read_text(encoding='utf-8')
          old='''# Exact pack remains mandatory evidence: quota conflict still fails closed rather\n# than silently returning a partial exact-file package.\nwith tempfile.TemporaryDirectory(prefix='ptv6187_packquota_') as td:\n    root=Path(td); (root/'patchs').mkdir(); (root/'a.txt').write_text('A\\n'); (root/'b.txt').write_text('B\\n')\n    request={'id':'exact-pack-quota','actions':[{'type':'pack','paths':['a.txt','b.txt']}],'limits':{'max_files':1}}\n    request_zip=root/'patchs'/'CODE_COLLECTION_REQUEST_exact-pack-quota.zip'\n    with zipfile.ZipFile(request_zip,'w') as zf:\n        zf.writestr('CODE_COLLECTION_REQUEST_exact-pack-quota.json',json.dumps(request))\n    try:\n        c._run_request(root,request_zip)\n    except ValueError as exc:\n        assert 'max_files' in str(exc),exc\n    else:\n        raise AssertionError('exact pack quota unexpectedly degraded into partial success')\n\nprint('PASS: v6.20.2 exact pack quota remains fail-closed')\n'''
          assert x.count(old)==1, x.count(old)
          new='''# Resource/quota failure after at least one exact file is now fail-partial:\n# preserve collected files, mark INCOMPLETE and embed a handoff describing the error.\nwith tempfile.TemporaryDirectory(prefix='ptv6187_packquota_') as td:\n    root=Path(td); (root/'patchs').mkdir(); (root/'a.txt').write_text('A\\n'); (root/'b.txt').write_text('B\\n')\n    request={'id':'exact-pack-quota','actions':[{'type':'pack','paths':['a.txt','b.txt']}],'limits':{'max_files':1}}\n    request_zip=root/'patchs'/'CODE_COLLECTION_REQUEST_exact-pack-quota.zip'\n    with zipfile.ZipFile(request_zip,'w') as zf:\n        zf.writestr('CODE_COLLECTION_REQUEST_exact-pack-quota.json',json.dumps(request))\n    result,_archived,_count,_lifecycle,status=c._run_request(root,request_zip)\n    assert status=='INCOMPLETE',status\n    with zipfile.ZipFile(result) as zf:\n        names=set(zf.namelist())\n        assert 'files/a.txt' in names and 'files/b.txt' not in names,names\n        assert any(n.startswith('handoff/COLLECT_INCOMPLETE_HANDOFF_') and n.endswith('.json') for n in names),names\n        manifest=json.loads(zf.read('COLLECTION_MANIFEST.json'))\n        assert manifest['file_count']==1 and manifest['collection_status']=='INCOMPLETE',manifest\n        assert manifest['resource_incomplete'] is True,manifest\n\n# If a resource failure happens before even one file is collected, retain the\n# existing hard failure contract and publish no result artifact.\nwith tempfile.TemporaryDirectory(prefix='ptv6187_zerofilequota_') as td:\n    root=Path(td); (root/'patchs').mkdir(); (root/'big.txt').write_text('X'*4096)\n    request={'id':'zero-file-quota','actions':[{'type':'pack','paths':['big.txt']}],'limits':{'max_file_bytes':16}}\n    request_zip=root/'patchs'/'CODE_COLLECTION_REQUEST_zero-file-quota.zip'\n    with zipfile.ZipFile(request_zip,'w') as zf:\n        zf.writestr('CODE_COLLECTION_REQUEST_zero-file-quota.json',json.dumps(request))\n    try:\n        c._run_request(root,request_zip)\n    except ValueError as exc:\n        assert 'max_file_bytes' in str(exc),exc\n    else:\n        raise AssertionError('zero-file resource failure unexpectedly published a partial result')\n    out=root/'artifacts'/'patch_tool_code_collections'\n    assert not out.exists() or not list(out.glob('CODE_COLLECTION_RESULT_*.zip'))\n\nprint('PASS: v6.20.2 resource quota preserves partial files and zero-file failure remains hard')\n'''
          x=x.replace(old,new,1)

          insertion='''\n# Parent-side legacy safety-cap exception also degrades to INCOMPLETE when a\n# previous action already collected a file, with an embedded handoff.\nwith tempfile.TemporaryDirectory(prefix='ptv6187_safetycap_partial_') as td:\n    root=Path(td); (root/'patchs').mkdir(); (root/'keep.txt').write_text('KEEP\\n')\n    request={'id':'safetycap-partial','actions':[{'type':'pack','paths':['keep.txt']},{'type':'search','query':'x','regex':True,'paths':['.']}]}\n    request_zip=root/'patchs'/'CODE_COLLECTION_REQUEST_safetycap-partial.zip'\n    with zipfile.ZipFile(request_zip,'w') as zf:\n        zf.writestr('CODE_COLLECTION_REQUEST_safetycap-partial.json',json.dumps(request))\n    original=c._search_action\n    c._search_action=lambda *_a,**_k: (_ for _ in ()).throw(ValueError('regex search worker result exceeded safety cap (58211054 bytes)'))\n    try:\n        result,_archived,_count,_lifecycle,status=c._run_request(root,request_zip)\n    finally:\n        c._search_action=original\n    assert status=='INCOMPLETE',status\n    with zipfile.ZipFile(result) as zf:\n        names=set(zf.namelist())\n        assert 'files/keep.txt' in names,names\n        handoffs=[n for n in names if n.startswith('handoff/COLLECT_INCOMPLETE_HANDOFF_') and n.endswith('.json')]\n        assert handoffs,names\n        handoff=json.loads(zf.read(handoffs[0]))\n        assert any('58211054' in r for r in handoff['reasons']),handoff\n\n# The worker itself now bounds an oversized JSON payload instead of handing the\n# parent a >cap result that becomes rc=2.\nimport python_patch_collect_regex_worker as rw\nlimits=dict(cs.DEFAULT_LIMITS); limits['max_report_bytes']=1024*1024\npayload={'report':'R'*1000,'incomplete':False,'coverage_status':'VERIFIED','execution_status':'COMPLETED','reasons':[],'matches':5000,'match_details':[{'path':f'f{i}.txt','context':'C'*8192} for i in range(600)],'coverage':{'ok':True}}\nraw=rw._bounded_payload_json(payload,limits)\nassert len(raw.encode('utf-8')) <= 2*1024*1024,len(raw)\nbounded=json.loads(raw)\nassert bounded['incomplete'] is True and bounded['coverage_status']=='PARTIAL',bounded\nassert bounded['matches']==5000 and len(bounded['match_details']) < 600,bounded\nassert any('safety cap' in r for r in bounded['reasons']),bounded\n\nprint('PASS: v6.20.2 regex safety-cap result is bounded and partial evidence survives')\n'''
          anchor="print('PASS: v6.20.2 resource quota preserves partial files and zero-file failure remains hard')\n"
          assert x.count(anchor)==1
          x=x.replace(anchor,anchor+insertion,1)

          # Existing timeout E2E must now carry a resource handoff too.
          old="        assert 'files/after.txt' in names,names\n        manifest=json.loads(zf.read('COLLECTION_MANIFEST.json'))\n"
          assert x.count(old)==1, x.count(old)
          new="        assert 'files/after.txt' in names,names\n        assert any(n.startswith('handoff/COLLECT_INCOMPLETE_HANDOFF_') and n.endswith('.json') for n in names),names\n        manifest=json.loads(zf.read('COLLECTION_MANIFEST.json'))\n"
          x=x.replace(old,new,1)
          test.write_text(x,encoding='utf-8')
          PY
      - name: Refresh release metadata
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/python_patch_release_metadata.py --tool-dir .
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/python_patch_release_metadata.py --tool-dir . --check
      - name: Targeted COLLECT regressions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ptv-project
          mkdir -p /tmp/ptv-project/tools
          rsync -a --exclude=.git --exclude=.github ./ /tmp/ptv-project/tools/
          cd /tmp/ptv-project/tools/_patch_lib
          export PYTHONDONTWRITEBYTECODE=1
          python3 self_test_search_partial_timeout_v6_20_0.py
          python3 self_test_collect_pack_v6_20_0.py
          python3 self_test_collect_progress_v6_20_0.py
          python3 self_test_cleartext_companion_v6_20_0.py
          python3 self_test_package_checksums_v6_20_0.py
      - name: Full master regression
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ptv-project/tools/_patch_lib
          export PYTHONDONTWRITEBYTECODE=1
          python3 self_test_python_patch_tool_v6_20_0.py
          python3 python_patch_release_metadata.py --tool-dir .. --check
      - name: Commit hotfix directly to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hotfix-collect-partial-resource-failure.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/python_patch_release_metadata.py --tool-dir .
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/python_patch_release_metadata.py --tool-dir . --check
          git config user.name 'Patch Tool CI'
          git config user.email 'patch-tool-ci@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve partial collect results on resource limits'
          git push origin HEAD:main
