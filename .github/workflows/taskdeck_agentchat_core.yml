name: TaskDeck Agent Chat protocol core

on:
  push:
    paths:
      - 'vscode_tasks_menu_go/internal/agentchat/**'
      - 'vscode_tasks_menu_go/internal/agentrun/**'
      - 'vscode_tasks_menu_go/internal/server/agent_*.go'
      - 'vscode_tasks_menu_go/web/featuremods/agentchat*.js'
      - 'vscode_tasks_menu_go/web/featuremods/agentproviderselector.js'
      - 'vscode_tasks_menu_go/web/agentchat*_test.cjs'
      - 'vscode_tasks_menu_go/web/agentproviderselector_test.cjs'
      - 'vscode_tasks_menu_go/internal/taskmanifest/**'
      - 'vscode_tasks_menu_go/internal/server/agent_chat_task_manifest*'
      - 'vscode_tasks_menu_go/internal/server/agent_run_*'
      - 'vscode_tasks_menu_go/web/featuremods/agentchat.js'
      - 'vscode_tasks_menu_go/web/featuremods/agentchatformat.js'
      - 'vscode_tasks_menu_go/web/agentchat_bootstrap_test.cjs'
      - 'vscode_tasks_menu_go/web/featuremods/next.js'
      - 'vscode_tasks_menu_go/web/featuremods/terminalchatcontext.js'
      - 'vscode_tasks_menu_go/web/terminalchatcontext_test.cjs'
      - 'vscode_tasks_menu_go/web/featuremods/menus.js'
      - 'vscode_tasks_menu_go/web/featuremods/agentchat_runs_ui.js'
      - 'vscode_tasks_menu_go/web/featuremods/agentchat_coordination.js'
      - 'vscode_tasks_menu_go/web/agentchat_runs_isolation_test.cjs'
      - 'vscode_tasks_menu_go/web/agentchat_coordination_test.cjs'
      - 'vscode_tasks_menu_go/internal/server/agent_chat_*'
      - 'vscode_tasks_menu_go/internal/server/server.go'
      - 'vscode_tasks_menu_go/internal/server/patch_work_exclusivity.go'
      - 'vscode_tasks_menu_go/internal/server/shared_authorization.go'
      - 'python_patch_entry.py'
      - '_patch_lib/python_patch_collect_schema.py'
      - 'test_agent_collect_preflight.py'
      - 'test_agent_failed_queue.py'
      - '_patch_lib/python_patch_queue_dispatcher.py'
      - '_patch_lib/python_patch_collect_progress_v6_7.py'
      - '.github/workflows/taskdeck_agentchat_core.yml'
  pull_request:
    paths:
      - 'vscode_tasks_menu_go/internal/agentchat/**'
      - 'vscode_tasks_menu_go/internal/agentrun/**'
      - 'vscode_tasks_menu_go/internal/server/agent_*.go'
      - 'vscode_tasks_menu_go/web/featuremods/agentchat*.js'
      - 'vscode_tasks_menu_go/web/featuremods/agentproviderselector.js'
      - 'vscode_tasks_menu_go/web/agentchat*_test.cjs'
      - 'vscode_tasks_menu_go/web/agentproviderselector_test.cjs'
      - 'vscode_tasks_menu_go/internal/taskmanifest/**'
      - 'vscode_tasks_menu_go/internal/server/agent_chat_task_manifest*'
      - 'vscode_tasks_menu_go/internal/server/agent_run_*'
      - 'vscode_tasks_menu_go/web/featuremods/agentchat.js'
      - 'vscode_tasks_menu_go/web/featuremods/agentchatformat.js'
      - 'vscode_tasks_menu_go/web/agentchat_bootstrap_test.cjs'
      - 'vscode_tasks_menu_go/web/featuremods/next.js'
      - 'vscode_tasks_menu_go/web/featuremods/terminalchatcontext.js'
      - 'vscode_tasks_menu_go/web/terminalchatcontext_test.cjs'
      - 'vscode_tasks_menu_go/web/featuremods/menus.js'
      - 'vscode_tasks_menu_go/web/featuremods/agentchat_runs_ui.js'
      - 'vscode_tasks_menu_go/web/featuremods/agentchat_coordination.js'
      - 'vscode_tasks_menu_go/web/agentchat_runs_isolation_test.cjs'
      - 'vscode_tasks_menu_go/web/agentchat_coordination_test.cjs'
      - 'vscode_tasks_menu_go/internal/server/agent_chat_*'
      - 'vscode_tasks_menu_go/internal/server/server.go'
      - 'vscode_tasks_menu_go/internal/server/patch_work_exclusivity.go'
      - 'vscode_tasks_menu_go/internal/server/shared_authorization.go'
      - 'python_patch_entry.py'
      - '_patch_lib/python_patch_collect_schema.py'
      - 'test_agent_collect_preflight.py'
      - 'test_agent_failed_queue.py'
      - '_patch_lib/python_patch_queue_dispatcher.py'
      - '_patch_lib/python_patch_collect_progress_v6_7.py'
      - '.github/workflows/taskdeck_agentchat_core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agentchat-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: vscode_tasks_menu_go/go.sum
      - name: Measure bounded Collection coverage metadata
        working-directory: vscode_tasks_menu_go
        run: go test -count=1 -run '^TestNativeCoverageMetadataAggregateBoundAndRenameDelete
        working-directory: vscode_tasks_menu_go
        run: |
          go test -race -count=1 ./internal/agentchat/...
          go test -v -race -count=1 ./internal/agentrun/...
          go test -v -count=1 ./internal/server -run '^TestAgentCLP20'
          go test -count=1 ./internal/server -run '^TestAgent'
          go test -v -race -count=1 ./internal/server -run '^(TestAgentRun|TestAgentConversation|TestAgentCoordination|TestAgentContext|TestAgentTask|TestAgentProvider)'
          go test -race -count=1 ./internal/taskmanifest
          go vet ./internal/agentchat/... ./internal/agentrun/... ./internal/taskmanifest
          go vet ./internal/server
          node --check web/featuremods/agentchat.js
          node --check web/featuremods/agentchatformat.js
          node --check web/featuremods/agentchat_runs_ui.js
          node --check web/featuremods/agentchat_coordination.js
          node --check web/featuremods/terminalchatcontext.js
          node web/terminalchatcontext_test.cjs
          node web/agentchat_bootstrap_test.cjs
          node --check web/featuremods/agentproviderselector.js
          node --test web/agentchat_coordination_test.cjs web/agentchat_runs_isolation_test.cjs web/agentproviderselector_test.cjs
          node test_ai_smart_terminal.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test canonical Python COLLECT schema preflight (no queue side effects)
        run: python test_agent_collect_preflight.py
      - name: Cross-compile Agent state filesystem guard for macOS
        working-directory: vscode_tasks_menu_go
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go test -c -o "$RUNNER_TEMP/agentchat-darwin-arm64.test" ./internal/agentchat
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go test -c -o "$RUNNER_TEMP/agentchat-darwin-amd64.test" ./internal/agentchat

  agent-failed-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native failed-queue retirement and PASS protection
        run: python test_agent_failed_queue.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: vscode_tasks_menu_go/go.sum
      - name: Test Agent failed-queue admission
        working-directory: vscode_tasks_menu_go
        run: go test -count=1 ./internal/server -run '^TestAgentFailedQueue'
 -bench '^BenchmarkNativeCoverageMetadata
        working-directory: vscode_tasks_menu_go
        run: |
          go test -race -count=1 ./internal/agentchat/...
          go test -v -race -count=1 ./internal/agentrun/...
          go test -v -count=1 ./internal/server -run '^TestAgentCLP20'
          go test -count=1 ./internal/server -run '^TestAgent'
          go test -v -race -count=1 ./internal/server -run '^(TestAgentRun|TestAgentConversation|TestAgentCoordination|TestAgentContext|TestAgentTask|TestAgentProvider)'
          go test -race -count=1 ./internal/taskmanifest
          go vet ./internal/agentchat/... ./internal/agentrun/... ./internal/taskmanifest
          go vet ./internal/server
          node --check web/featuremods/agentchat.js
          node --check web/featuremods/agentchatformat.js
          node --check web/featuremods/agentchat_runs_ui.js
          node --check web/featuremods/agentchat_coordination.js
          node --check web/featuremods/terminalchatcontext.js
          node web/terminalchatcontext_test.cjs
          node web/agentchat_bootstrap_test.cjs
          node --check web/featuremods/agentproviderselector.js
          node --test web/agentchat_coordination_test.cjs web/agentchat_runs_isolation_test.cjs web/agentproviderselector_test.cjs
          node test_ai_smart_terminal.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test canonical Python COLLECT schema preflight (no queue side effects)
        run: python test_agent_collect_preflight.py
      - name: Cross-compile Agent state filesystem guard for macOS
        working-directory: vscode_tasks_menu_go
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go test -c -o "$RUNNER_TEMP/agentchat-darwin-arm64.test" ./internal/agentchat
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go test -c -o "$RUNNER_TEMP/agentchat-darwin-amd64.test" ./internal/agentchat

  agent-failed-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native failed-queue retirement and PASS protection
        run: python test_agent_failed_queue.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: vscode_tasks_menu_go/go.sum
      - name: Test Agent failed-queue admission
        working-directory: vscode_tasks_menu_go
        run: go test -count=1 ./internal/server -run '^TestAgentFailedQueue'
 -benchtime=200ms -benchmem -v ./internal/agentchat/collectionprogress
      - name: Test agent chat context and session store
        working-directory: vscode_tasks_menu_go
        run: |
          go test -race -count=1 ./internal/agentchat/...
          go test -v -race -count=1 ./internal/agentrun/...
          go test -v -count=1 ./internal/server -run '^TestAgentCLP20'
          go test -count=1 ./internal/server -run '^TestAgent'
          go test -v -race -count=1 ./internal/server -run '^(TestAgentRun|TestAgentConversation|TestAgentCoordination|TestAgentContext|TestAgentTask|TestAgentProvider)'
          go test -race -count=1 ./internal/taskmanifest
          go vet ./internal/agentchat/... ./internal/agentrun/... ./internal/taskmanifest
          go vet ./internal/server
          node --check web/featuremods/agentchat.js
          node --check web/featuremods/agentchatformat.js
          node --check web/featuremods/agentchat_runs_ui.js
          node --check web/featuremods/agentchat_coordination.js
          node --check web/featuremods/terminalchatcontext.js
          node web/terminalchatcontext_test.cjs
          node web/agentchat_bootstrap_test.cjs
          node --check web/featuremods/agentproviderselector.js
          node --test web/agentchat_coordination_test.cjs web/agentchat_runs_isolation_test.cjs web/agentproviderselector_test.cjs
          node test_ai_smart_terminal.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test canonical Python COLLECT schema preflight (no queue side effects)
        run: python test_agent_collect_preflight.py
      - name: Cross-compile Agent state filesystem guard for macOS
        working-directory: vscode_tasks_menu_go
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go test -c -o "$RUNNER_TEMP/agentchat-darwin-arm64.test" ./internal/agentchat
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go test -c -o "$RUNNER_TEMP/agentchat-darwin-amd64.test" ./internal/agentchat

  agent-failed-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native failed-queue retirement and PASS protection
        run: python test_agent_failed_queue.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: vscode_tasks_menu_go/go.sum
      - name: Test Agent failed-queue admission
        working-directory: vscode_tasks_menu_go
        run: go test -count=1 ./internal/server -run '^TestAgentFailedQueue'
