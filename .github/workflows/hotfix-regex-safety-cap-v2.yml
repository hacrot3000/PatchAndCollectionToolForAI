name: hotfix-regex-safety-cap-v2
on:
  push:
    paths:
      - '.github/workflows/hotfix-regex-safety-cap-v2.yml'
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard expected baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d943c2ba307a63717976996642602da49796de7c HEAD
          unexpected="$(git diff --name-only d943c2ba307a63717976996642602da49796de7c..HEAD | grep -Ev '^(\.ptv_work/hotfix_regex_parent_safety_cap_v2\.py|\.github/workflows/hotfix-regex-safety-cap-v2\.yml)$' || true)"
          test -z "$unexpected" || { echo "Unexpected concurrent main changes:"; echo "$unexpected"; exit 2; }
      - name: Apply hotfix
        run: python3 .ptv_work/hotfix_regex_parent_safety_cap_v2.py
      - name: Refresh release metadata
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/python_patch_release_metadata.py --tool-dir .
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/python_patch_release_metadata.py --tool-dir . --check
      - name: Targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -S _patch_lib/self_test_regex_worker_safety_cap_v6_20_2.py
          python3 -S _patch_lib/self_test_search_partial_timeout_v6_20_0.py
          python3 -S _patch_lib/self_test_collect_pack_v6_20_0.py
      - name: Full installed-layout regression
        shell: bash
        run: |
          set -euo pipefail
          proj="$(mktemp -d)"
          mkdir -p "$proj/tools"
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='.ptv_work' ./ "$proj/tools/"
          export PYTHONDONTWRITEBYTECODE=1
          cd "$proj/tools/_patch_lib"
          python3 -S python_patch_release_metadata.py --tool-dir .. --check
          python3 -S self_test_tool_health_v6_20_0.py
          python3 -S self_test_package_checksums_v6_20_0.py
          python3 -S self_test_python_patch_tool_v6_20_0.py
      - name: Commit hotfix directly to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hotfix-regex-safety-cap-v2.yml
          rm -f .ptv_work/hotfix_regex_parent_safety_cap_v2.py
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          rmdir .ptv_work 2>/dev/null || true
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/python_patch_release_metadata.py --tool-dir . --check
          git config user.name 'Patch Tool CI'
          git config user.email 'patch-tool-ci@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bound regex worker results before parent safety cap'
          git push origin HEAD:main
