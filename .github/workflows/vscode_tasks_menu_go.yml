name: VSCode Tasks Menu Go

# Manual-only: workflows are run from the GitHub Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      GOPROXY: "off"
      GOSUMDB: "off"
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.19.x"
          - "1.23.x"
    defaults:
      run:
        working-directory: vscode_tasks_menu_go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: JavaScript syntax
        run: |
          find web -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o /tmp/vscode_tasks_menu ./cmd/vscode_tasks_menu
