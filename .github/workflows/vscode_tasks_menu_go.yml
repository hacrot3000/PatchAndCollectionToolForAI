name: VSCode Tasks Menu Go

on:
  push:
    branches:
      - "main"
      - "IDE_tool"
    paths:
      - "vscode_tasks_menu"
      - "install.sh"
      - "python_patch_entry.py"
      - "test_python_patch_entry.py"
      - "run_python_patches.sh"
      - "run_python_patches.ps1"
      - "vscode_tasks_menu_go/**"
      - ".github/workflows/vscode_tasks_menu_go.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      GOPROXY: "off"
      GOSUMDB: "off"
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.19.x"
          - "1.23.x"
    defaults:
      run:
        working-directory: vscode_tasks_menu_go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Launcher and installer syntax
        run: |
          bash -n ../vscode_tasks_menu
          bash -n ../install.sh
          bash -n ../run_python_patches.sh

      - name: Patch entry routing contract
        working-directory: .
        run: |
          python3 ../test_python_patch_entry.py
          python3 -m py_compile ../python_patch_entry.py

      - name: JavaScript syntax
        run: |
          find web -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -buildvcs=false -trimpath -o /tmp/taskdeck ./cmd/vscode_tasks_menu
