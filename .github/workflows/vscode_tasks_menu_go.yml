name: VSCode Tasks Menu Go

on:
  push:
    branches:
      - "main"
      - "IDE_tool"
      - "feat/multi-user-shared-server"
    paths:
      - "vscode_tasks_menu"
      - "install.sh"
      - "python_patch_entry.py"
      - "test_python_patch_entry.py"
      - "run_python_patches.sh"
      - "run_python_patches.ps1"
      - "vscode_tasks_menu_go/**"
      - "TASKDECK_PATCH_HANDOFF.md"
      - "TASKDECK_PATCH_ADDON_PLAN.md"
      - "TASKDECK_PATCH_NATIVE_PARITY_AUDIT.md"
      - "README.md"
      - "implementing.md"
      - "test_taskdeck_patch_handoff_state.py"
      - ".github/workflows/vscode_tasks_menu_go.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      GOPROXY: "off"
      GOSUMDB: "off"
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.19.x"
          - "1.23.x"
    defaults:
      run:
        working-directory: vscode_tasks_menu_go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Launcher and installer syntax
        run: |
          bash -n ../vscode_tasks_menu
          bash -n ../install.sh
          bash -n ../run_python_patches.sh

      - name: Patch entry routing contract
        working-directory: .
        run: |
          python3 test_python_patch_entry.py
          python3 -m py_compile python_patch_entry.py

      - name: JavaScript syntax
        run: |
          find web -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done

      - name: TaskDeck Patch handoff state
        working-directory: .
        run: python3 test_taskdeck_patch_handoff_state.py

      - name: Self-update staged Go tests
        working-directory: .
        run: |
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          cp -a vscode_tasks_menu_go "$stage/vscode_tasks_menu_go"
          cp -a _patch_lib "$stage/_patch_lib"
          for file in             vscode_tasks_menu             install.sh             python_patch_entry.py             test_python_patch_entry.py             run_python_patches.sh             run_python_patches.ps1             run_python_patches.bat; do
            cp -a "$file" "$stage/$file"
          done
          (
            cd "$stage/vscode_tasks_menu_go"
            go test ./...
          )

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -buildvcs=false -trimpath -o /tmp/taskdeck ./cmd/vscode_tasks_menu
