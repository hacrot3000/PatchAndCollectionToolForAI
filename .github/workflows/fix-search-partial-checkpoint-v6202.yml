name: Fix v6.20.2 regex partial checkpoint preservation

on:
  push:
    branches:
      - ptv-v6.20.2-upload-helper
    paths:
      - .github/workflows/fix-search-partial-checkpoint-v6202.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ptv-v6.20.2-hardening-work
          fetch-depth: 0

      - name: Preserve safe regex evidence before catastrophic later files
        shell: bash
        run: |
          set -euo pipefail
          expected=22544608a250126d386aa26574fea7a35f49f16f
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || { echo "Unexpected work branch HEAD: $actual"; exit 2; }

          git fetch origin ptv-v6.20.2-upload-helper
          git show origin/ptv-v6.20.2-upload-helper:.ptv_ci/fix_search_partial_checkpoint_v6202.py > /tmp/fix_search_partial_checkpoint_v6202.py
          python3 /tmp/fix_search_partial_checkpoint_v6202.py

          rm -rf /tmp/ptv-searchfix
          mkdir -p /tmp/ptv-searchfix/project/tools
          tar --exclude=.git --exclude='__pycache__' --exclude='*.pyc' -cf - . | tar -xf - -C /tmp/ptv-searchfix/project/tools
          cd /tmp/ptv-searchfix/project/tools
          export PYTHONDONTWRITEBYTECODE=1
          python3 _patch_lib/self_test_search_partial_timeout_v6_20_0.py
          python3 _patch_lib/self_test_search_discovery_v6_20_0.py
          python3 _patch_lib/self_test_collect_pack_v6_20_0.py
          python3 _patch_lib/self_test_collect_progress_v6_20_0.py

          cd "$GITHUB_WORKSPACE"
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/python_patch_release_metadata.py --tool-dir .
          PYTHONDONTWRITEBYTECODE=1 python3 _patch_lib/python_patch_release_metadata.py --tool-dir . --check
          test -z "$(find . -name '__pycache__' -o -name '*.pyc' | head -n 1)"

          git config user.name "Patch Tool CI"
          git config user.email "patch-tool-ci@users.noreply.github.com"
          git add _patch_lib/python_patch_collect_compat.py _patch_lib/PACKAGE_CONTENTS.txt _patch_lib/SHA256SUMS
          git commit -m "fix: preserve regex search evidence across hard timeouts"
          git push origin HEAD:ptv-v6.20.2-hardening-work
